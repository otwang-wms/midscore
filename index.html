<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小自然期中考 - 試卷分析與班級錯題診斷儀表板</title>
    <!-- 引入 Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', "Microsoft JhengHei", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 頂部控制列 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls {
            display: flex;
            align-items: center;
            background: #EEF2FF;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #C7D2FE;
        }

        .controls label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: var(--primary-hover);
            font-size: 1.1rem;
            user-select: none;
        }

        .controls input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        /* 圖表區塊 */
        .chart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            height: 60vh;
            min-height: 450px;
            width: 100%;
        }

        /* 數據表格區塊 */
        .table-wrapper {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .table-header-title {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.2rem;
            font-weight: bold;
            color: #374151;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 1000px;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th {
            background-color: #F9FAFB;
            font-weight: 600;
            color: #4B5563;
            position: sticky;
            top: 0;
            white-space: nowrap;
        }

        tbody tr:hover {
            background-color: #F3F4F6;
        }

        /* 動態隱藏/顯示的題目欄位 */
        .question-col {
            display: none;
            max-width: 400px;
            line-height: 1.5;
            color: #4B5563;
        }

        .show-text .question-col {
            display: table-cell;
        }

        /* 錯題率徽章 */
        .badge {
            background-color: #FEE2E2;
            color: #991B1B;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
        }
        
        .badge.warning {
            background-color: #FEF3C7;
            color: #92400E;
        }

        .badge.good {
            background-color: #D1FAE5;
            color: #065F46;
        }

        /* RWD 適應 */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .chart-container { height: 50vh; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 頂部區塊 -->
        <div class="header">
            <h1>📊 試卷分析與班級錯題診斷儀表板</h1>
            <div class="controls">
                <label>
                    <input type="checkbox" id="showTextCheckbox">
                    顯示題目內容
                </label>
            </div>
        </div>

        <!-- 視覺化長條圖 -->
        <div class="chart-container">
            <canvas id="errorRateChart"></canvas>
        </div>

        <!-- 各班錯題明細表 -->
        <div class="table-wrapper">
            <div class="table-header-title">📋 試題分析明細表 (依全校錯題率排序)</div>
            <div class="table-responsive" id="tableContainer">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>題號</th>
                            <th class="question-col">完整題目內容</th>
                            <th>全校錯題率</th>
                            <th>錯題總人數</th>
                            <!-- 班級欄位由 JS 動態生成 -->
                            <th id="classHeadersPlaceholder"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 資料由 JS 填入 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // === 經過 Python 運算並清理過的 JSON 資料 ===
        const reportData = [{"id": "配合2-5", "text": "請閱讀各題敘述，判斷『 』標示的名詞是屬於水的哪一種形態，並將對應的英文代號填在答案卷上：A固態  B液態  C氣態 (5)用茶壺燒開水時，壺口上方冒出的『白煙』", "total_errors": 91, "total_students": 165, "total_rate": 55.2, "classes": {"601": {"errors": 10, "students": 18, "rate": 55.6}, "605": {"errors": 13, "students": 25, "rate": 52.0}, "606": {"errors": 18, "students": 25, "rate": 72.0}, "607": {"errors": 15, "students": 23, "rate": 65.2}, "612": {"errors": 14, "students": 25, "rate": 56.0}, "613": {"errors": 7, "students": 25, "rate": 28.0}, "616": {"errors": 14, "students": 24, "rate": 58.3}}}, {"id": "是非5", "text": "颱風中心的氣壓數值，通常會比颱風外圍其他地方的氣壓數值還要高，因此颱風風力極強。", "total_errors": 81, "total_students": 165, "total_rate": 49.1, "classes": {"601": {"errors": 10, "students": 18, "rate": 55.6}, "605": {"errors": 11, "students": 25, "rate": 44.0}, "606": {"errors": 16, "students": 25, "rate": 64.0}, "607": {"errors": 10, "students": 23, "rate": 43.5}, "612": {"errors": 8, "students": 25, "rate": 32.0}, "613": {"errors": 12, "students": 25, "rate": 48.0}, "616": {"errors": 14, "students": 24, "rate": 58.3}}}, {"id": "是非4", "text": "在地面天氣圖上標示「L」的低氣壓中心，其周圍氣壓是由內而外依次遞減，愈往外數值愈低。", "total_errors": 53, "total_students": 165, "total_rate": 32.1, "classes": {"601": {"errors": 4, "students": 18, "rate": 22.2}, "605": {"errors": 9, "students": 25, "rate": 36.0}, "606": {"errors": 8, "students": 25, "rate": 32.0}, "607": {"errors": 12, "students": 23, "rate": 52.2}, "612": {"errors": 10, "students": 25, "rate": 40.0}, "613": {"errors": 4, "students": 25, "rate": 16.0}, "616": {"errors": 6, "students": 24, "rate": 25.0}}}, {"id": "選擇10", "text": "10.冬季或春季時，臺灣西部海域若剛好遇到「（西）南風將潮溼溫暖的空氣帶過來，當空氣遇到下方較冷的海水」，容易發生什麼天氣變化？    (1)容易引發劇烈的熱帶氣旋（颱風）  (2)容易讓空氣中的水氣遇冷起霧（海霧） (3)容易導致該海域的水氣結冰降雪 (4)西部沿海會颳起乾燥悶熱的焚風", "total_errors": 51, "total_students": 165, "total_rate": 30.9, "classes": {"601": {"errors": 5, "students": 18, "rate": 27.8}, "605": {"errors": 13, "students": 25, "rate": 52.0}, "606": {"errors": 9, "students": 25, "rate": 36.0}, "607": {"errors": 5, "students": 23, "rate": 21.7}, "612": {"errors": 10, "students": 25, "rate": 40.0}, "613": {"errors": 3, "students": 25, "rate": 12.0}, "616": {"errors": 6, "students": 24, "rate": 25.0}}}, {"id": "選擇24", "text": "24.小瑄利用紙杯進行保溫實驗，他在紙杯外包覆了一層「乾燥的毛巾」。請問，這層毛巾的主要保溫原理是什麼？ (1)毛巾可以自行產生並釋放熱能加熱水杯 (2)毛巾纖維中含有大量靜止空氣，空氣是熱的不良導體，可減少熱傳導 (3)毛巾表面粗糙，容易從周圍空氣中吸收熱量來維持溫度 (4)毛巾的布料能反射大部分的熱輻射", "total_errors": 48, "total_students": 165, "total_rate": 29.1, "classes": {"601": {"errors": 6, "students": 18, "rate": 33.3}, "605": {"errors": 10, "students": 25, "rate": 40.0}, "606": {"errors": 5, "students": 25, "rate": 20.0}, "607": {"errors": 6, "students": 23, "rate": 26.1}, "612": {"errors": 9, "students": 25, "rate": 36.0}, "613": {"errors": 7, "students": 25, "rate": 28.0}, "616": {"errors": 5, "students": 24, "rate": 20.8}}}, {"id": "選擇25", "text": "25.綠建築在進行結構建材設計時，其中為了「降低熱傳導」，綠建築在工程上通常會如何設計？ (1)牆壁採用金屬銅板，以加快白天與黑夜的 熱交換 (2)裝設電動排氣百葉窗，加速外牆內外的空氣交換 (3)外牆選用熱傳導較差的建材，或在牆體間 裝設隔熱工程 (4)外牆全部塗成黑色，以反射陽光中的過多能量", "total_errors": 47, "total_students": 165, "total_rate": 28.5, "classes": {"601": {"errors": 7, "students": 18, "rate": 38.9}, "605": {"errors": 10, "students": 25, "rate": 40.0}, "606": {"errors": 6, "students": 25, "rate": 24.0}, "607": {"errors": 4, "students": 23, "rate": 17.4}, "612": {"errors": 9, "students": 25, "rate": 36.0}, "613": {"errors": 4, "students": 25, "rate": 16.0}, "616": {"errors": 7, "students": 24, "rate": 29.2}}}, {"id": "選擇13", "text": "13.若氣象預報顯示有一個「強烈颱風」正逐步逼近臺灣東部海域。此時在地面天氣圖上，臺灣東部海域會呈現何種等壓線的特徵？ (1)等壓線呈現非常稀疏且筆直的水平平行線條 (2)圍繞低氣壓中心呈現多圈、非常密集的封閉同心圓 (3)等壓線數值由颱風中心向外依次大幅度遞減 (4)天氣圖上該區域完全沒有等壓線，只標示藍色三角形符號", "total_errors": 35, "total_students": 165, "total_rate": 21.2, "classes": {"601": {"errors": 4, "students": 18, "rate": 22.2}, "605": {"errors": 4, "students": 25, "rate": 16.0}, "606": {"errors": 5, "students": 25, "rate": 20.0}, "607": {"errors": 6, "students": 23, "rate": 26.1}, "612": {"errors": 7, "students": 25, "rate": 28.0}, "613": {"errors": 3, "students": 25, "rate": 12.0}, "616": {"errors": 6, "students": 24, "rate": 25.0}}}, {"id": "是非10", "text": "安裝在工廠或住家屋頂的「無動力屋頂通風器」，是完全利用電力的旋轉來強行帶動室內與室外的空氣對流。", "total_errors": 34, "total_students": 165, "total_rate": 20.6, "classes": {"601": {"errors": 7, "students": 18, "rate": 38.9}, "605": {"errors": 5, "students": 25, "rate": 20.0}, "606": {"errors": 6, "students": 25, "rate": 24.0}, "607": {"errors": 4, "students": 23, "rate": 17.4}, "612": {"errors": 6, "students": 25, "rate": 24.0}, "613": {"errors": 3, "students": 25, "rate": 12.0}, "616": {"errors": 3, "students": 24, "rate": 12.5}}}, {"id": "選擇12", "text": "12.當兩個颱風距離足夠接近時會產生「藤原效應」。在西元 2017 年的歷史實例中，強颱「蘇拉」主導了互動，並最終將弱颱「谷超」的環流結構完全併入。這屬於藤原效應的哪一種情形？ (1)兩個颱風強度相當，像兩位舞者互繞旋轉 (2)強颱變強，弱颱變更弱，且強颱將弱颱環流結構吞併  (3)兩個颱風在接近後，互相排斥並朝相反方向分離  (4)一個颱風分裂成兩個颱風，並向不同海域前進", "total_errors": 32, "total_students": 165, "total_rate": 19.4, "classes": {"601": {"errors": 3, "students": 18, "rate": 16.7}, "605": {"errors": 3, "students": 25, "rate": 12.0}, "606": {"errors": 4, "students": 25, "rate": 16.0}, "607": {"errors": 5, "students": 23, "rate": 21.7}, "612": {"errors": 5, "students": 25, "rate": 20.0}, "613": {"errors": 5, "students": 25, "rate": 20.0}, "616": {"errors": 7, "students": 24, "rate": 29.2}}}, {"id": "選擇6", "text": "6.每當氣象播報員預報「冷鋒過境臺灣」時，臺灣各地的天氣在冷鋒通過「後」，通常會發生什麼變化？  (1)氣溫開始下降，通常造成寒冷天氣  (2)氣溫會迅速上升，轉為晴朗炎熱天氣  (3)氣壓急劇下降，風勢完全停止吹拂   (4)天空完全無雲，並吹起溫暖的西南風", "total_errors": 31, "total_students": 165, "total_rate": 18.8, "classes": {"601": {"errors": 2, "students": 18, "rate": 11.1}, "605": {"errors": 3, "students": 25, "rate": 12.0}, "606": {"errors": 5, "students": 25, "rate": 20.0}, "607": {"errors": 4, "students": 23, "rate": 17.4}, "612": {"errors": 4, "students": 25, "rate": 16.0}, "613": {"errors": 4, "students": 25, "rate": 16.0}, "616": {"errors": 9, "students": 24, "rate": 37.5}}}, {"id": "選擇14", "text": "14.六年級的阿光在生活中觀察到許多現象，請問下列哪一個現象最適合用「氣體熱脹冷縮」的原理來解釋？ (1)凹陷的乒乓球泡熱水後恢復原狀 (2)用打氣筒將空氣打入氣球後，氣球膨脹變大  (3)酒精溫度計隨溫度變化而上升或下降  (4)橋梁和橋梁連結處之間會保留縫隙", "total_errors": 31, "total_students": 165, "total_rate": 18.8, "classes": {"601": {"errors": 6, "students": 18, "rate": 33.3}, "605": {"errors": 4, "students": 25, "rate": 16.0}, "606": {"errors": 1, "students": 25, "rate": 4.0}, "607": {"errors": 6, "students": 23, "rate": 26.1}, "612": {"errors": 5, "students": 25, "rate": 20.0}, "613": {"errors": 4, "students": 25, "rate": 16.0}, "616": {"errors": 5, "students": 24, "rate": 20.8}}}, {"id": "選擇15", "text": "15.固體、液體和氣體都有熱脹冷縮的物理性質。請問在「相同溫度變化」的條件下，哪一種狀態的物質其「體積膨脹程度」最為明顯？ (1)固體     (2)液體 (3)氣體  (4)三種狀態膨脹程度完全相同", "total_errors": 29, "total_students": 165, "total_rate": 17.6, "classes": {"601": {"errors": 3, "students": 18, "rate": 16.7}, "605": {"errors": 6, "students": 25, "rate": 24.0}, "606": {"errors": 4, "students": 25, "rate": 16.0}, "607": {"errors": 7, "students": 23, "rate": 30.4}, "612": {"errors": 4, "students": 25, "rate": 16.0}, "613": {"errors": 2, "students": 25, "rate": 8.0}, "616": {"errors": 3, "students": 24, "rate": 12.5}}}, {"id": "是非8", "text": "熱在傳播時，通常會從溫度高的地方傳到溫度低的地方，直到兩者的溫度達到平衡為止。", "total_errors": 26, "total_students": 165, "total_rate": 15.8, "classes": {"601": {"errors": 4, "students": 18, "rate": 22.2}, "605": {"errors": 5, "students": 25, "rate": 20.0}, "606": {"errors": 3, "students": 25, "rate": 12.0}, "607": {"errors": 6, "students": 23, "rate": 26.1}, "612": {"errors": 4, "students": 25, "rate": 16.0}, "613": {"errors": 2, "students": 25, "rate": 8.0}, "616": {"errors": 2, "students": 24, "rate": 8.3}}}, {"id": "選擇16", "text": "16.在課堂「固體的熱脹冷縮」實驗中，常溫下銅球剛好能穿過銅環。如果我們「只用火源加熱銅環（不加熱銅球）」，再試著用常溫的銅球穿過銅環，結果會如何？ (1)銅球更難穿過去，因為銅環受熱膨脹，中間的孔徑會收縮變小 (2)銅環因受熱其重量會劇烈增加，導致銅球在穿過時直接卡住 (3)銅環受熱融化成液態銅，實驗無法進行 (4)銅球能更容易地穿過銅環，因為銅環受熱整體膨脹，中間圓孔孔徑也隨之變大", "total_errors": 26, "total_students": 165, "total_rate": 15.8, "classes": {"601": {"errors": 5, "students": 18, "rate": 27.8}, "605": {"errors": 2, "students": 25, "rate": 8.0}, "606": {"errors": 1, "students": 25, "rate": 4.0}, "607": {"errors": 3, "         function initChart() {
            const ctx = document.getElementById('errorRateChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '全校錯題率 (%)',
                        data: overallRates,
                        backgroundColor: 'rgba(79, 70, 229, 0.7)',

                        borderColor: 'rgba(79, 70, 229, 0.9)'

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.9)',

                            bodyFont: { size: 13, family: "'Segoe UI', sans-serif" },
                            padding: 12,
                            callbacks: {
                                title: function(context) {
                                    return '【題號：' + context[0].label + '】';

                                beforeBody: function(context) {
                                    const isShowText = document.getElementById('showTextCheckbox').checked;
                                    if(isShowText) {
                                        const text = reportData[context[0].dataIndex].text;
                                        let wrapped = ['[ 題目內容 ]'];
                                        // 簡單的文字斷行處理，讓 Tooltip 不會過長
                                        for(let i=0; i<text.length; i+=26){
                                            wrapped.push(text.substring(i, i+26));
                                        }
                                        wrapped.push(' '); // 空行分隔
                                        return wrapped;
                                    }
                                    return null;
                                },
                                label: function(context) {
                                    const data = reportData[context.dataIndex];
                                    return `全校總計: 錯題率 ${data.total_rate}% (${data.total_errors}人 / 共${data.total_students}人)`;
                                },
                                // 顯示精準的各班錯題人數與比例
                                afterLabel: function(context) {
                                    const data = reportData[context.dataIndex];
                                    let details = ['--------------------------------'];
                                    classes.forEach(c => {

                                        details.push(`📍 ${c}班: 錯題率 ${cData.rate}% (${cData.errors}人 / 共${cData.students}人)`);

                            ticks: { maxRotation: 45, minRotation: 45 }
                        }
                    }
                }
            });
        }

        // 渲染資料表格
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            reportData.forEach((d, index) => {
                const tr = document.createElement('tr');
                
                // 動態組裝各班級資料欄位
                let classHtml = '';
                classes.forEach(c => {
                    const cData = d.classes[c];
                    let style = '';
                    if(cData.rate >= 50) style = 'color: #DC2626; font-weight: bold;';
                    else if(cData.rate >= 30) style = 'color: #D97706; font-weight: bold;';
                    
                    classHtml += `<td style="${style}">${cData.rate}% <span style="font-size: 0.85em; color: #6B7280;">(${cData.errors}人)</span></td>`;
                });

                // 全校錯題徽章樣式設定
                let badgeClass = 'badge';
                if(d.total_rate >= 50) badgeClass += ''; 
                else if (d.total_rate >= 20) badgeClass += ' warning';
                else badgeClass += ' good';

                tr.innerHTML = `
                    <td><strong>${index + 1}</strong></td>
                    <td style="font-weight: 600; color: var(--primary);">${d.id}</td>
                    <td class="question-col">${d.text}</td>
                    <td><span class="${badgeClass}">${d.total_rate}%</span></td>
                    <td>${d.total_errors} / ${d.total_students}</td>
                    ${classHtml}
                `;
                tbody.appendChild(tr);
            });
        }

        // 監聽「顯示題目內容」勾選框切換事件
        document.getElementById('showTextCheckbox').addEventListener('change', function() {
            const container = document.getElementById('tableContainer');

            if(this.checked) {

            } else {

            }

        });

        // 啟動渲染
        initChart();
        renderTable();
